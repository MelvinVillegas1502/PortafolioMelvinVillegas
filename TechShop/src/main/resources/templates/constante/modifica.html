<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{general/fragmentos :: head}"/>
<body>
<header th:replace="~{general/fragmentos :: header}"/>

<section class="container my-4">
    <h1>Modificar constante</h1>

    <form th:action="@{/constante/guardar}" th:object="${constante}" method="post">
        <input type="hidden" th:field="*{idConstante}"/>

        <label>Atributo</label>
        <input class="form-control mb-2" type="text" th:field="*{atributo}" required/>

        <label>Valor</label>
        <input class="form-control mb-2" type="text" th:field="*{valor}" required/>

        <div class="mt-3">
            <button class="btn btn-success" type="submit">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/constante/listado}">Regresar</a>
        </div>
    </form>
</section>

<footer th:replace="~{general/fragmentos :: footer}"/>
</body>
</html>
