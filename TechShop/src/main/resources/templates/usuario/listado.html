<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{general/fragmentos :: head}"/>
<body>
<header th:replace="~{general/fragmentos :: header}"/>

<section class="container my-4">
    <h1>Listado de usuarios</h1>

    <p th:if="${todoOk}" th:text="${todoOk}" class="alert alert-success"></p>
    <p th:if="${error}" th:text="${error}" class="alert alert-danger"></p>

    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#agregarUsuarioModal">
        Agregar usuario
    </button>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Nombre</th>
            <th>Apellidos</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Activo</th>
            <th>Modificar</th>
            <th>Eliminar</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.idUsuario}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.nombre}"></td>
            <td th:text="${u.apellidos}"></td>
            <td th:text="${u.correo}"></td>
            <td th:text="${u.telefono}"></td>
            <td th:text="${u.activo}"></td>
            <td>
                <a class="btn btn-warning btn-sm"
                   th:href="@{'/usuario/modificar/' + ${u.idUsuario}}">
                    Modificar
                </a>
            </td>
            <td>
                <form th:action="@{/usuario/eliminar}" method="post">
                    <input type="hidden" name="idUsuario" th:value="${u.idUsuario}"/>
                    <button class="btn btn-danger btn-sm" type="submit">
                        Eliminar
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>

<div class="modal fade" id="agregarUsuarioModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/usuario/guardar}" th:object="${usuario}" method="post">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">Agregar usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <label>Username</label>
                    <input class="form-control mb-2" type="text" th:field="*{username}" required/>

                    <label>Password</label>
                    <input class="form-control mb-2" type="password" th:field="*{password}" required/>

                    <label>Nombre</label>
                    <input class="form-control mb-2" type="text" th:field="*{nombre}" required/>

                    <label>Apellidos</label>
                    <input class="form-control mb-2" type="text" th:field="*{apellidos}" required/>

                    <label>Correo</label>
                    <input class="form-control mb-2" type="email" th:field="*{correo}" required/>

                    <label>Teléfono</label>
                    <input class="form-control mb-2" type="text" th:field="*{telefono}"/>

                    <label>Ruta imagen</label>
                    <input class="form-control mb-2" type="text" th:field="*{rutaImagen}"/>

                    <div class="form-check mt-2">
                        <input class="form-check-input" type="checkbox" th:field="*{activo}"/>
                        <label class="form-check-label">Activo</label>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-success" type="submit">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{general/fragmentos :: footer}"/>
</body>
</html>
