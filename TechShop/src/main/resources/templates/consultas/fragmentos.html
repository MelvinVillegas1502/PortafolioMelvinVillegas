<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <head>
     <title>Consultas</title>
        <meta charset="UTF-8"/>
    </head>
    
    <body>

        <!-- Fragmento para los formularios de consultas -->
        <section th:fragment="consultas" class="container my-4">
            <h1 class="text-center mb-4">Consultas de productos</h1>
            <p class="text-center">
                Filtrar productos por rango de precio usando consulta derivada, JPQL y SQL.
            </p>

            <div class="row row-cols-1 row-cols-md-4 g-3">

                <div th:replace="~{consultas/fragmentos :: formConsulta('primary', #{consultas.derivadas}, '/consultas/consultaDerivada')}">
                </div>

                <div th:replace="~{consultas/fragmentos :: formConsulta('warning', #{consultas.jpql}, '/consultas/consultaJPQL')}">
                </div>

                <div th:replace="~{consultas/fragmentos :: formConsulta('success', #{consultas.sql}, '/consultas/consultaSQL')}">
                </div>

                <div class="col">
                    <div class="card h-100 p-3">
                        <div class="card-header text-center bg-secondary text-white">
                            Práctica #2
                        </div>
                        <div class="card-body">
                            <p class="text-center">
                                Acá va su Práctica #2
                            </p>
                        </div>
                    </div>
                </div>

            </div>
        </section>


        <!-- Fragmento reutilizable para cada formulario -->
        <div th:fragment="formConsulta(colorForm, textoForm, urlForm)" class="col">
            <form method="post" th:action="@{${urlForm}}" class="was-validated">
                <div class="card h-100 p-2">

                    <div class="card-header text-center text-white" th:classappend="${'bg-' + colorForm}">
                        <h5>[[${textoForm}]]</h5>
                    </div>

                    <div class="card-body">
                        <div class="mb-3">
                            <label>[[#{consultas.precio.inferior}]]</label>
                            <input type="number"
                                   name="precioInf"
                                   th:value="${precioInf}"
                                   class="form-control"
                                   min="0"
                                   step="0.01"
                                   required/>
                        </div>

                        <div class="mb-3">
                            <label>[[#{consultas.precio.superior}]]</label>
                            <input type="number"
                                   name="precioSup"
                                   th:value="${precioSup}"
                                   class="form-control"
                                   min="0"
                                   step="0.01"
                                   required/>
                        </div>
                    </div>

                    <div class="card-footer text-center">
                        <button type="submit"
                                class="btn text-white"
                                th:classappend="${'btn-' + colorForm}">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            [[${textoForm}]]
                        </button>
                    </div>

                </div>
            </form>
        </div>


        <!-- Fragmento para el listado de tarjetas de productos -->
        <section th:fragment="tarjetas" class="container py-4">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">

                <div th:each="p : ${productos}" class="col">
                    <div class="card h-100 shadow-sm">

                        <div class="d-flex justify-content-center align-items-center bg-light p-3" style="height: 200px;">
                            <img th:src="${p.rutaImagen}"
                                 class="img-fluid"
                                 th:alt="${p.descripcion}"
                                 style="max-height: 100%; object-fit: contain;"/>
                        </div>

                        <div class="card-header bg-white">
                            <h5 class="card-title text-center text-truncate mb-0"
                                th:text="${p.descripcion}">
                                Título
                            </h5>
                        </div>

                        <div class="card-body d-flex flex-column">
                            <p class="card-text text-muted mb-auto text-truncate"
                               th:text="${p.detalle}">
                                Detalle
                            </p>
                        </div>

                        <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                            <div class="fw-bold">
                                <span class="text-success h5"
                                      th:text="${#numbers.formatCurrency(p.precio)}">
                                    ₡0
                                </span>

                                <span th:if="${p.existencias > 0}"
                                      class="badge text-bg-success ms-2"
                                      th:text="${p.existencias} + ' unidades'">
                                </span>

                                <span th:unless="${p.existencias > 0}"
                                      class="badge text-bg-danger ms-2">
                                    Agotado
                                </span>
                            </div>

                            <form th:action="@{/carrito/agregar}" method="post" class="d-inline">
                                <input type="hidden" th:value="${p.idProducto}" name="idProducto"/>

                                <button type="submit"
                                        class="btn btn-sm btn-primary"
                                        th:disabled="${p.existencias == 0}"
                                        onclick="addCart(this.form)">
                                    <i class="fas fa-cart-plus"></i>
                                </button>
                            </form>
                        </div>

                    </div>
                </div>

            </div>
        </section>

    </body>
</html>
