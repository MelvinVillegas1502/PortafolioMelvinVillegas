<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:fragment="head">
    <title>TechShop</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />

    <!-- CSS propio -->
    <link th:href="@{/css/estilos.css}" rel="stylesheet" />
</head>

<body>

<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">

            <a class="navbar-brand" th:href="@{/}">
                TechShop
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item px-2">
                        <a class="nav-link" th:href="@{/}">Inicio</a>
                    </li>

                    <li class="nav-item px-2">
                        <a class="nav-link" th:href="@{/categoria/listado}">Categorías</a>
                    </li>

                    <li class="nav-item px-2">
                        <a class="nav-link" th:href="@{/producto/listado}">Productos</a>
                    </li>

                    <li class="nav-item px-2">
                        <a class="nav-link" th:href="@{/consultas/listado}">Consultas</a>
                    </li>

                    <li class="nav-item dropdown px-2" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link dropdown-toggle" href="#" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            Administración
                        </a>

                        <ul class="dropdown-menu">

                            <li>
                                <a class="dropdown-item" th:href="@{/producto/listado}">
                                    Productos
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item" th:href="@{/categoria/listado}">
                                    Categorías
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item" th:href="@{/usuario/listado}">
                                    Usuarios
                                </a>
                            </li>

                        </ul>
                    </li>

                </ul>

                <ul class="navbar-nav">

                    <li class="nav-item px-2" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/login}">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </a>
                    </li>

                    <li class="nav-item px-2" sec:authorize="isAuthenticated()">
                        <span class="nav-link">
                            <i class="fas fa-user"></i>
                            <span sec:authentication="name">Usuario</span>
                        </span>
                    </li>

                    <li class="nav-item px-2" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post">
                            <button class="btn btn-link nav-link" type="submit">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </button>
                        </form>
                    </li>

                </ul>

            </div>
        </div>
    </nav>
</header>

<footer th:fragment="footer" class="bg-success text-white text-center mt-5 p-3">
    <p class="mb-0">TechShop &copy; 2026</p>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
