<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<body>

<section th:fragment="botonesAgregar" class="py-4 mb-4 bg-light">
    <div class="container">
        <div class="row">
            <div class="col-md-3" sec:authorize="hasRole('ADMIN')">
                <button type="button"
                        class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#agregarProducto">
                    <i class="fas fa-plus"></i> Agregar producto
                </button>
            </div>
        </div>
    </div>
</section>

<section th:fragment="agregarProducto">
    <div id="agregarProducto"
         class="modal fade"
         tabindex="-1"
         aria-labelledby="agregarProductoLabel"
         aria-hidden="true">

        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <form th:action="@{/producto/guardar}"
                      th:object="${producto}"
                      method="post"
                      enctype="multipart/form-data">

                    <div class="modal-header bg-info text-white">
                        <h5 class="modal-title" id="agregarProductoLabel">
                            Agregar producto
                        </h5>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                                aria-label="Close">
                        </button>
                    </div>

                    <div class="modal-body">

                        <div class="mb-3">
                            <label>Descripción</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{descripcion}"
                                   required="required" />
                        </div>

                        <div class="mb-3">
                            <label>Detalle</label>
                            <textarea class="form-control"
                                      th:field="*{detalle}"
                                      rows="3"
                                      required="required">
                            </textarea>
                        </div>

                        <div class="mb-3">
                            <label>Precio</label>
                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   th:field="*{precio}"
                                   required="required" />
                        </div>

                        <div class="mb-3">
                            <label>Existencias</label>
                            <input type="number"
                                   class="form-control"
                                   th:field="*{existencias}"
                                   required="required" />
                        </div>

                        <div class="mb-3">
                            <label>Categoría</label>
                            <select class="form-control" th:field="*{categoria.idCategoria}">
                                <option th:each="c : ${categorias}"
                                        th:value="${c.idCategoria}"
                                        th:text="${c.descripcion}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label>Imagen</label>
                            <input type="file"
                                   class="form-control"
                                   name="imagenFile"
                                   accept="image/*" />
                        </div>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{activo}" />
                            <label class="form-check-label">Activo</label>
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-success" type="submit">
                            <i class="fas fa-save"></i> Guardar
                        </button>

                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cerrar
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</section>

<section th:fragment="listadoProductos" class="container my-4">

    <div class="row">
        <div class="col-md-12">
            <h1>Listado de productos</h1>

            <p th:if="${todoOk}" th:text="${todoOk}" class="alert alert-success"></p>
            <p th:if="${error}" th:text="${error}" class="alert alert-danger"></p>
        </div>
    </div>

    <div class="row" th:if="${productos != null and !productos.empty}">
        <div class="col-md-4 mb-4" th:each="producto : ${productos}">

            <div class="card h-100">

                <img th:if="${producto.rutaImagen != null and producto.rutaImagen != ''}"
                     th:src="${producto.rutaImagen}"
                     class="card-img-top"
                     style="height: 220px; object-fit: cover;"
                     alt="Imagen producto" />

                <div class="card-body">
                    <h5 class="card-title" th:text="${producto.descripcion}"></h5>

                    <p class="card-text" th:text="${producto.detalle}"></p>

                    <p>
                        <strong>Precio:</strong>
                        <span th:text="${#numbers.formatCurrency(producto.precio)}"></span>
                    </p>

                    <p>
                        <strong>Existencias:</strong>
                        <span th:text="${producto.existencias}"></span>
                    </p>

                    <p>
                        <strong>Activo:</strong>
                        <span th:text="${producto.activo}"></span>
                    </p>
                </div>

                <div class="card-footer">

                    <form th:action="@{/carrito/agregar}"
                          method="post"
                          sec:authorize="hasAnyRole('USUARIO','ADMIN')">

                        <input type="hidden"
                               name="idProducto"
                               th:value="${producto.idProducto}" />

                        <button type="submit" class="btn btn-primary w-100 mb-2">
                            <i class="fas fa-cart-plus"></i> Agregar al carrito
                        </button>
                    </form>

                    <a sec:authorize="hasRole('ADMIN')"
                       th:href="@{/producto/modificar/} + ${producto.idProducto}"
                       class="btn btn-warning w-100 mb-2">
                        <i class="fas fa-pen"></i> Modificar
                    </a>

                    <a sec:authorize="hasRole('ADMIN')"
                       th:href="@{/producto/eliminar/} + ${producto.idProducto}"
                       class="btn btn-danger w-100">
                        <i class="fas fa-trash"></i> Eliminar
                    </a>

                </div>

            </div>
        </div>
    </div>

    <div th:if="${productos == null or productos.empty}" class="alert alert-info">
        No hay productos registrados.
    </div>

</section>

<section th:fragment="tarjetas" class="container my-4">

    <div class="row" th:if="${productos != null and !productos.empty}">
        <div class="col-md-4 mb-4" th:each="producto : ${productos}">

            <div class="card h-100">

                <img th:if="${producto.rutaImagen != null and producto.rutaImagen != ''}"
                     th:src="${producto.rutaImagen}"
                     class="card-img-top"
                     style="height: 220px; object-fit: cover;"
                     alt="Imagen producto" />

                <div class="card-body">
                    <h5 class="card-title" th:text="${producto.descripcion}"></h5>
                    <p class="card-text" th:text="${producto.detalle}"></p>

                    <p>
                        <strong>Precio:</strong>
                        <span th:text="${#numbers.formatCurrency(producto.precio)}"></span>
                    </p>

                    <p>
                        <strong>Existencias:</strong>
                        <span th:text="${producto.existencias}"></span>
                    </p>
                </div>

                <div class="card-footer">

                    <form th:action="@{/carrito/agregar}"
                          method="post"
                          sec:authorize="hasAnyRole('USUARIO','ADMIN')">

                        <input type="hidden"
                               name="idProducto"
                               th:value="${producto.idProducto}" />

                        <button type="submit" class="btn btn-primary w-100 mb-2">
                            <i class="fas fa-cart-plus"></i> Agregar al carrito
                        </button>
                    </form>

                    <a sec:authorize="hasRole('ADMIN')"
                       th:href="@{/producto/modificar/} + ${producto.idProducto}"
                       class="btn btn-warning w-100 mb-2">
                        <i class="fas fa-pen"></i> Modificar
                    </a>

                    <a sec:authorize="hasRole('ADMIN')"
                       th:href="@{/producto/eliminar/} + ${producto.idProducto}"
                       class="btn btn-danger w-100">
                        <i class="fas fa-trash"></i> Eliminar
                    </a>

                </div>

            </div>
        </div>
    </div>

</section>

<section th:fragment="editarProducto" class="container my-4">

    <h1>Modificar producto</h1>

    <form th:action="@{/producto/guardar}"
          th:object="${producto}"
          method="post"
          enctype="multipart/form-data">

        <input type="hidden" th:field="*{idProducto}" />
        <input type="hidden" th:field="*{rutaImagen}" />

        <div class="mb-3">
            <label>Descripción</label>
            <input type="text"
                   class="form-control"
                   th:field="*{descripcion}"
                   required="required" />
        </div>

        <div class="mb-3">
            <label>Detalle</label>
            <textarea class="form-control"
                      th:field="*{detalle}"
                      rows="3"
                      required="required">
            </textarea>
        </div>

        <div class="mb-3">
            <label>Precio</label>
            <input type="number"
                   step="0.01"
                   class="form-control"
                   th:field="*{precio}"
                   required="required" />
        </div>

        <div class="mb-3">
            <label>Existencias</label>
            <input type="number"
                   class="form-control"
                   th:field="*{existencias}"
                   required="required" />
        </div>

        <div class="mb-3">
            <label>Categoría</label>
            <select class="form-control" th:field="*{categoria.idCategoria}">
                <option th:each="c : ${categorias}"
                        th:value="${c.idCategoria}"
                        th:text="${c.descripcion}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label>Imagen</label>
            <input type="file"
                   class="form-control"
                   name="imagenFile"
                   accept="image/*" />
        </div>

        <div class="form-check">
            <input class="form-check-input"
                   type="checkbox"
                   th:field="*{activo}" />
            <label class="form-check-label">Activo</label>
        </div>

        <div class="mt-3">
            <button class="btn btn-success" type="submit">
                Guardar
            </button>

            <a class="btn btn-secondary" th:href="@{/producto/listado}">
                Regresar
            </a>
        </div>

    </form>

</section>

<section th:fragment="confirmarEliminar" class="container my-4">

    <div class="card">
        <div class="card-header bg-danger text-white">
            <h1>Eliminar producto</h1>
        </div>

        <div class="card-body">
            <p>
                ¿Seguro que desea eliminar el producto
                <strong th:text="${producto.descripcion}"></strong>?
            </p>

            <form th:action="@{/producto/eliminar}" method="post">
                <input type="hidden"
                       name="idProducto"
                       th:value="${producto.idProducto}" />

                <button class="btn btn-danger" type="submit">
                    Eliminar
                </button>

                <a class="btn btn-secondary" th:href="@{/producto/listado}">
                    Cancelar
                </a>
            </form>
        </div>
    </div>

</section>

</body>
</html>
