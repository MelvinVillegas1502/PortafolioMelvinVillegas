<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{general/fragmentos :: head}"/>
<body>
<header th:replace="~{general/fragmentos :: header}"/>

<section class="container mt-5">
    <h2 class="mb-4">
        <i class="fas fa-users-cog"></i> Gestión de roles por usuario
    </h2>

    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Buscar usuario</h5>
        </div>

        <div class="card-body">
            <form method="get"
                  th:action="@{/usuario_rol/buscar}"
                  th:object="${usuario}"
                  class="row g-3 align-items-end">

                <div class="col-md-4">
                    <label class="form-label">Username</label>
                    <input type="text"
                           name="username"
                           th:field="*{username}"
                           class="form-control"
                           required/>
                </div>

                <div class="col-md-auto">
                    <button type="submit" class="btn btn-success">
                        Buscar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="alert alert-warning"
         th:if="${usuario == null}">
        No se encontró ningún usuario.
    </div>

    <div class="row" th:if="${usuario != null and usuario.idUsuario != null}">

        <div class="col-lg-4 mb-4">
            <div class="card h-100 shadow">
                <div class="card-header bg-info text-white">
                    Usuario
                </div>

                <div class="card-body">
                    <p><strong>Username:</strong> <span th:text="${usuario.username}"></span></p>
                    <p><strong>Nombre:</strong> <span th:text="${usuario.nombre + ' ' + usuario.apellidos}"></span></p>
                    <p><strong>Correo:</strong> <span th:text="${usuario.correo}"></span></p>
                    <p><strong>Teléfono:</strong> <span th:text="${usuario.telefono}"></span></p>
                </div>
            </div>
        </div>

        <div class="col-lg-4 mb-4">
            <div class="card h-100 shadow">
                <div class="card-header bg-secondary text-white">
                    Roles asignados
                </div>

                <div class="card-body">
                    <div th:if="${#lists.isEmpty(rolesAsignados)}" class="text-muted">
                        Este usuario no tiene roles asignados.
                    </div>

                    <table th:unless="${#lists.isEmpty(rolesAsignados)}" class="table table-striped">
                        <tbody>
                        <tr th:each="rol : ${rolesAsignados}">
                            <td th:text="${rol.rol}"></td>
                            <td class="text-end">
                                <form method="get" th:action="@{/usuario_rol/eliminar}">
                                    <input type="hidden" name="idRol" th:value="${rol.idRol}"/>
                                    <input type="hidden" name="username" th:value="${usuario.username}"/>
                                    <button class="btn btn-sm btn-danger" type="submit">
                                        Quitar
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4 mb-4">
            <div class="card h-100 shadow">
                <div class="card-header bg-success text-white">
                    Roles disponibles
                </div>

                <div class="card-body">
                    <div th:if="${#lists.isEmpty(rolesDisponibles)}" class="text-muted">
                        Todos los roles ya están asignados.
                    </div>

                    <table th:unless="${#lists.isEmpty(rolesDisponibles)}" class="table table-striped">
                        <tbody>
                        <tr th:each="rol : ${rolesDisponibles}">
                            <td th:text="${rol}"></td>
                            <td class="text-end">
                                <form method="get" th:action="@{/usuario_rol/agregar}">
                                    <input type="hidden" name="nombreRol" th:value="${rol}"/>
                                    <input type="hidden" name="username" th:value="${usuario.username}"/>
                                    <button class="btn btn-sm btn-success" type="submit">
                                        Agregar
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</section>

<footer th:replace="~{general/fragmentos :: footer}"/>
</body>
</html>
